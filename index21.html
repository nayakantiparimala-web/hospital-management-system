<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        input,
        select {
            width: 28%;
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .delete {
            background: red;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #222;
            color: white;
        }

        #count {
            font-weight: bold;
            font-size: 20px;
        }

        @media (max-width: 700px) {
            input,
            select {
                width: 100%;
                margin: 5px 0;
            }

            button {
                width: 100%;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Hospital Management System</h1>
    <p>Full Stack Development Project</p>
</header>

<div class="container">

    <div class="card">

        <h2>Register Patient</h2>

        <input
            type="text"
            id="name"
            placeholder="Patient Name"
        >

        <input
            type="number"
            id="age"
            placeholder="Age"
        >

        <select id="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <input
            type="text"
            id="disease"
            placeholder="Disease"
        >

        <button onclick="addPatient()">
            Register Patient
        </button>

    </div>

    <div class="card">

        <h2>Search Patient</h2>

        <input
            type="text"
            id="search"
            placeholder="Search by name or disease"
            onkeyup="searchPatient()"
        >

        <p>
            Total Patients:
            <span id="count">0</span>
        </p>

    </div>

    <div class="card">

        <h2>Patient Details</h2>

        <table>

            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Disease</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="patientTable"></tbody>

        </table>

    </div>

</div>

<script>

    let patients =
        JSON.parse(localStorage.getItem("patients")) || [];

    displayPatients(patients);

    function addPatient() {

        let name =
            document.getElementById("name").value.trim();

        let age =
            document.getElementById("age").value.trim();

        let gender =
            document.getElementById("gender").value;

        let disease =
            document.getElementById("disease").value.trim();

        if (
            name === "" ||
            age === "" ||
            gender === "" ||
            disease === ""
        ) {
            alert("Please fill all fields");
            return;
        }

        let patient = {
            name: name,
            age: age,
            gender: gender,
            disease: disease
        };

        patients.push(patient);

        localStorage.setItem(
            "patients",
            JSON.stringify(patients)
        );

        document.getElementById("name").value = "";
        document.getElementById("age").value = "";
        document.getElementById("gender").value = "";
        document.getElementById("disease").value = "";

        displayPatients(patients);
    }

    function displayPatients(list) {

        let table =
            document.getElementById("patientTable");

        table.innerHTML = "";

        list.forEach(function(patient, index) {

            let row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${patient.name}</td>
                <td>${patient.age}</td>
                <td>${patient.gender}</td>
                <td>${patient.disease}</td>
                <td>
                    <button
                        class="delete"
                        onclick="deletePatient(${index})">
                        Delete
                    </button>
                </td>
            `;

            table.appendChild(row);
        });

        document.getElementById("count").innerText =
            list.length;
    }

    function deletePatient(index) {

        patients.splice(index, 1);

        localStorage.setItem(
            "patients",
            JSON.stringify(patients)
        );

        displayPatients(patients);
    }

    function searchPatient() {

        let text =
            document.getElementById("search")
            .value
            .toLowerCase();

        let filtered =
            patients.filter(function(patient) {

                return (
                    patient.name
                        .toLowerCase()
                        .includes(text) ||

                    patient.disease
                        .toLowerCase()
                        .includes(text)
                );
            });

        displayPatients(filtered);
    }

</script>

</body>
</html>
